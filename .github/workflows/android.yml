name: Build Android APK

on:
  push:
    branches: [main, app-v2]
    paths: ['app/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get latest catalog
        run: |
          mkdir -p app/public
          # main / app-v2 use the published nightly catalog; other branches build their own
          # so new categories and picture fixes are in the APK straight away.
          if [ "$GITHUB_REF_NAME" = "app-v2" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            if git fetch -q --depth 1 origin catalog; then git show FETCH_HEAD:catalog.json > app/public/catalog.json; fi
          fi
          # Only catalogs built with the strict picture checks (v4+) are good enough.
          if [ ! -s app/public/catalog.json ] || ! node -e 'process.exit(require("./app/public/catalog.json").version >= 4 ? 0 : 1)'; then
            (cd app && node build-catalog.mjs public/catalog.json && tail -n +1 catalog-report.md | head -40)
          fi
          ls -la app/public

      - name: Build web app
        working-directory: app
        run: |
          rm -f node_modules
          npm install --no-audit --no-fund
          npm run build
          npm run build:android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK + AAB
        working-directory: android
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/BlindRank-v2-build${{ github.run_number }}.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/BlindRank-v2-build${{ github.run_number }}.aab

      - uses: actions/upload-artifact@v4
        with:
          name: BlindRank-apk
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BlindRank-aab
          path: out/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/dist

      - name: Publish test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Blind Rank v2 — test build ${{ github.run_number }}" \
            --notes "Install the APK on Android to test. Signed with the shared test key, so each new build installs over the previous one."
