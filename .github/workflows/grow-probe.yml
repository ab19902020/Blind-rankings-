name: Grow audit
# Lists what every category tops up with (kept vs dropped by the relevance check).
on:
  push:
    branches: ['ccr-**']
    paths: ['app/grow-audit.mjs', 'app/src/data-more.js', '.github/workflows/grow-probe.yml']
  workflow_dispatch:
concurrency:
  group: grow-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: app
        run: node grow-audit.mjs > audit.txt; cat audit.txt
