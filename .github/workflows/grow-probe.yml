name: Grow probe
on:
  push:
    branches: ['ccr-**']
    paths: ['app/grow-probe.mjs', '.github/workflows/grow-probe.yml']
  workflow_dispatch:
    inputs:
      ids:
        description: 'Category ids'
        default: 'g_darts,fc_utd,a_men,mu_rap,vg_best,n_dogs,cr_uk,hg_pres'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: app
        run: |
          node grow-probe.mjs "g_darts,fc_utd,a_rising,vg_best,fd_fast,mb_all,pl_cities,car_brands" GET
          node grow-probe.mjs "f_all,f_now,f_gk,a_legends,a_brits,cr_uk,cr_us,c_box,g_ten,mu_country,hg_science,a_com" GET
