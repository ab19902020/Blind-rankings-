name: Grow probe
on:
  push:
    branches: ['ccr-**']
    paths: ['app/grow-probe.mjs', '.github/workflows/grow-probe.yml']
  workflow_dispatch:
    inputs:
      ids:
        description: 'Category ids'
        default: 'g_darts,fc_utd,a_men,mu_rap,vg_best,n_dogs,cr_uk,hg_pres'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: app
        run: |
          node grow-probe.mjs "f_gk,c_box,g_ten,cr_uk,cr_us,cr_yt,cr_gaming,mu_emo,uk_grime,hg_royals" GET
          node grow-probe.mjs "n_cats,car_jdm,pl_wonders,m_norse,m_heroes,vg_switch,fd_choc,fd_cereal,a_disney,tc_snl,b_mod,a_nfl_qbs" GET
