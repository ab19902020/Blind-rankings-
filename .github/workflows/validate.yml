name: Validate categories

on:
  push:
    branches: [app-v2]
    paths: ['app/src/data.js', 'app/src/resolve.js', 'app/validate.mjs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every challenge against TMDB + Wikipedia
        working-directory: app
        run: node validate.mjs
      - name: Publish report (draft release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete validation-report -y --cleanup-tag || true
          gh release create validation-report app/validation-report.json app/validation-report.md --draft --title "Category validation" --notes "Automated category check"
